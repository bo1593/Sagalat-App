<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سقالات — منصة المقاولات وتأجير المعدات في مصر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#052014',
                        forestLight: '#0A3823',
                        gold: '#D4AF37',
                        goldHover: '#C5A028'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-28 selection:bg-gold selection:text-forest">

    <!-- Supabase Initialization -->
    <script>
        const SUPABASE_URL = 'https://dtddkcgerdynswrbmknu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tnHt7hYa9TO4rAS-tvEkpA_sraniuzS';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = JSON.parse(localStorage.getItem('sagalat_user')) || null;
    </script>

    <!-- Header -->
    <header class="bg-forest text-white shadow-xl sticky top-0 z-50 border-b border-gold/30">
        <div class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('home')">
                <div class="w-10 h-10 rounded-xl bg-gold/10 border border-gold/40 flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-helmet-safety text-gold text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider text-white">سـقـالات</h1>
                    <p class="text-[10px] text-gold tracking-widest uppercase font-semibold">مصر للمقاولات</p>
                </div>
            </div>
            <div id="header-user-area"></div>
        </div>
    </header>

    <!-- Banned Screen Overlay -->
    <div id="ban-screen" class="hidden fixed inset-0 bg-red-950/95 backdrop-blur-md z-50 flex items-center justify-center p-6 text-center text-white">
        <div class="bg-white text-slate-900 p-8 rounded-3xl max-w-sm w-full shadow-2xl border border-red-200">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-ban"></i>
            </div>
            <h2 class="text-2xl font-black mb-2 text-red-700">تم حظر حسابك</h2>
            <p class="text-xs text-slate-600 mb-4 leading-relaxed">عذراً، تم تعليق حسابك من قِبل إدارة المنصة لعدم الالتزام بالشروط.</p>
            <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl text-xs mb-6 font-semibold" id="ban-reason-text">
                السبب: غير محدد
            </div>
            <button onclick="logout()" class="w-full bg-slate-900 text-white py-3 rounded-2xl font-bold shadow-lg text-sm transition active:scale-95">تسجيل الخروج</button>
        </div>
    </div>

    <!-- Main Container -->
    <main id="app-container" class="max-w-md mx-auto p-4 transition-all duration-300">
        <!-- Dynamic content goes here -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-forest/95 backdrop-blur-md border-t border-gold/20 shadow-2xl z-40">
        <div class="max-w-md mx-auto flex justify-around py-2.5">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-gold text-xs font-bold transition">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span>الرئيسية</span>
            </button>
            <button onclick="switchTab('add')" id="nav-add" class="flex flex-col items-center text-slate-400 hover:text-gold text-xs font-medium transition">
                <i class="fa-solid fa-circle-plus text-lg text-gold mb-1"></i>
                <span>إضافة إعلان</span>
            </button>
            <button onclick="switchTab('requests')" id="nav-requests" class="flex flex-col items-center text-slate-400 hover:text-gold text-xs font-medium transition">
                <i class="fa-solid fa-list-check text-lg mb-1"></i>
                <span>طلباتي</span>
            </button>
            <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center text-slate-400 hover:text-gold text-xs font-medium transition">
                <i class="fa-solid fa-comments text-lg mb-1"></i>
                <span>الرسائل</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-400 hover:text-gold text-xs font-medium transition">
                <i class="fa-solid fa-user text-lg mb-1"></i>
                <span>حسابي</span>
            </button>
        </div>
    </nav>

    <!-- App JavaScript Logic -->
    <script>
        async function initApp() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session && session.user) {
                const authUser = session.user;
                let { data: profile } = await supabase.from('users').select('*').eq('id', authUser.id).single();

                if (!profile) {
                    const { data: newProfile } = await supabase.from('users').insert([{
                        id: authUser.id,
                        email: authUser.email,
                        full_name: authUser.user_metadata.full_name || 'مستخدم جديد',
                        role: 'worker'
                    }]).select().single();
                    profile = newProfile;
                }
                currentUser = profile;
                localStorage.setItem('sagalat_user', JSON.stringify(currentUser));
            }

            if (currentUser) {
                const { data: dbUser } = await supabase.from('users').select('*').eq('id', currentUser.id).single();
                if (dbUser && dbUser.is_banned) {
                    document.getElementById('ban-reason-text').innerText = `السبب: ${dbUser.ban_reason || 'مخالفة شروط الاستخدام'}`;
                    document.getElementById('ban-screen').classList.remove('hidden');
                    return;
                }
                if (dbUser) currentUser = dbUser;
            }

            renderHeader();
            switchTab('home');
        }

        function renderHeader() {
            const area = document.getElementById('header-user-area');
            if (!currentUser) {
                area.innerHTML = `<button onclick="switchTab('profile')" class="bg-gold text-forest px-4 py-2 rounded-xl font-black text-xs shadow-lg active:scale-95 transition">دخول</button>`;
            } else {
                area.innerHTML = `<span class="text-xs bg-forestLight border border-gold/40 px-3 py-1.5 rounded-full text-gold font-black shadow-inner">#${currentUser.short_id || '------'}</span>`;
            }
        }

        function getRoleName(role) {
            const roles = { contractor: 'مقاول', worker: 'عامل', supplier: 'مؤجر معدات', renter: 'مستأجر', admin: 'مدير النظام' };
            return roles[role] || role;
        }

        async function loginWithGoogle() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
            if (error) alert('خطأ في تسجيل جوجل: ' + error.message);
        }

        async function handlePhoneRegister() {
            const phone = document.getElementById('auth-phone').value.trim();
            const full_name = document.getElementById('auth-name').value.trim();
            const role = document.getElementById('auth-role').value;

            if (!phone || !full_name) {
                alert('الرجاء إدخال رقم الهاتف والاسم الكامل');
                return;
            }

            let { data: existing } = await supabase.from('users').select('*').eq('phone', phone).single();

            if (existing) {
                if (existing.is_banned) {
                    alert('هذا الحساب محظور!');
                    return;
                }
                currentUser = existing;
            } else {
                const { data: newUser, error } = await supabase.from('users').insert([
                    { phone, full_name, role }
                ]).select().single();

                if (error) {
                    alert('خطأ: ' + error.message);
                    return;
                }
                currentUser = newUser;
            }

            localStorage.setItem('sagalat_user', JSON.stringify(currentUser));
            alert('تم تسجيل الدخول بنجاح!');
            location.reload();
        }

        function logout() {
            supabase.auth.signOut();
            localStorage.removeItem('sagalat_user');
            currentUser = null;
            location.reload();
        }

        function switchTab(tab) {
            const container = document.getElementById('app-container');

            ['home', 'add', 'requests', 'chats', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.className = "flex flex-col items-center text-gold text-xs font-bold scale-105 transition";
                    } else {
                        btn.className = "flex flex-col items-center text-slate-400 hover:text-gold text-xs font-medium transition";
                    }
                }
            });

            if (tab === 'home') {
                container.innerHTML = `
                    <div class="mb-4">
                        <div class="bg-gradient-to-br from-forest to-forestLight text-white p-6 rounded-3xl shadow-xl border border-gold/20 text-center relative overflow-hidden">
                            <h2 class="text-xl font-black mb-2 text-gold">سقالات</h2>
                            <p class="text-xs text-slate-200 mb-4">منصة المقاولات وتأجير المعدات</p>
                            <div class="grid grid-cols-2 gap-3 mt-4">
                                <div onclick="filterCategory('job')" class="bg-forestLight/80 border border-gold/40 p-4 rounded-2xl cursor-pointer hover:bg-forest transition text-center shadow">
                                    <i class="fa-solid fa-helmet-safety text-gold text-2xl mb-1"></i>
                                    <div class="text-xs font-bold text-white">فرص العمل</div>
                                </div>
                                <div onclick="filterCategory('equipment')" class="bg-forestLight/80 border border-gold/40 p-4 rounded-2xl cursor-pointer hover:bg-forest transition text-center shadow">
                                    <i class="fa-solid fa-screwdriver-wrench text-gold text-2xl mb-1"></i>
                                    <div class="text-xs font-bold text-white">تأجير المعدات</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="relative mb-4">
                        <span class="absolute right-3.5 top-3.5 text-slate-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="search-input" onkeyup="filterListings()" placeholder="ابحث عن فرصة عمل أو معدات..." class="w-full pr-10 pl-4 py-3 bg-white border border-slate-200 rounded-2xl text-xs font-medium shadow-sm focus:outline-none focus:border-gold transition">
                    </div>
                    <h3 class="font-black text-sm text-forest mb-3">أحدث الإعلانات</h3>
                    <div id="listings-feed" class="space-y-3">
                        <div class="text-center py-10 text-slate-400 text-xs">جاري تحميل الإعلانات...</div>
                    </div>
                `;
                loadListings();
            } else if (tab === 'add') {
                renderAddForm(container);
            } else if (tab === 'requests') {
                renderRequests(container);
            } else if (tab === 'chats') {
                renderChats(container);
            } else if (tab === 'profile') {
                renderProfile(container);
            }
        }

        let allListings = [];
        async function loadListings() {
            const feed = document.getElementById('listings-feed');
            const { data: listings, error } = await supabase.from('listings').select('*').order('created_at', { ascending: false });

            if (error || !listings || listings.length === 0) {
                feed.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 text-xs shadow-sm">لا توجد إعلانات متاحة حالياً.</div>`;
                return;
            }

            allListings = listings;
            renderListings(allListings);
        }

        function renderListings(items) {
            const feed = document.getElementById('listings-feed');
            if (items.length === 0) {
                feed.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 text-xs shadow-sm">لا توجد نتائج مطابقة.</div>`;
                return;
            }

            feed.innerHTML = items.map(item => `
                <div class="bg-white p-4.5 rounded-2xl shadow-sm border border-slate-200 hover:border-gold/50 transition">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] bg-amber-50 text-amber-800 px-3 py-1 rounded-full font-black tracking-wider uppercase border border-amber-200">
                            ${item.type === 'job' ? 'فرصة عمل' : 'تأجير معدات'}
                        </span>
                        <span class="text-xs font-bold text-slate-500"><i class="fa-solid fa-location-dot text-gold ml-1"></i>${item.governorate} - ${item.area}</span>
                    </div>
                    <h3 class="font-black text-slate-900 text-base mb-1">${item.title}</h3>
                    <p class="text-xs text-slate-600 mb-4 leading-relaxed">${item.description || 'بدون تفاصيل.'}</p>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-100">
                        <span class="text-forest font-black text-sm">${item.price} <span class="text-[10px] text-slate-500">ج.م</span></span>
                        <button onclick="sendRequest('${item.id}', '${item.user_id}', '${item.type}')" class="bg-forest hover:bg-forestLight text-gold text-xs px-4 py-2 rounded-xl font-black shadow-md active:scale-95 transition">
                            تقديم طلب
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterListings() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allListings.filter(item => item.title.toLowerCase().includes(query) || item.governorate.toLowerCase().includes(query));
            renderListings(filtered);
        }

        function filterCategory(catType) {
            const filtered = allListings.filter(item => item.type === catType);
            renderListings(filtered);
        }

        async function sendRequest(listingId, ownerId, type) {
            if (!currentUser) {
                alert('الرجاء تسجيل الدخول أولاً.');
                switchTab('profile');
                return;
            }
            if (currentUser.id === ownerId) {
                alert('لا يمكنك تقديم طلب على إعلانك الشخصي!');
                return;
            }

            const { error } = await supabase.from('requests').insert([
                { listing_id: listingId, requester_id: currentUser.id, owner_id: ownerId, type: type === 'job' ? 'job' : 'rental' }
            ]);

            if (error) {
                alert('خطأ: ' + error.message);
                return;
            }
            alert('تم إرسال الطلب بنجاح!');
        }

        function renderAddForm(container) {
            if (!currentUser) { renderProfile(container); return; }
            if (currentUser.role === 'worker' || currentUser.role === 'renter') {
                container.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-3xl text-center text-xs font-bold">عذراً، نوع حسابك لا يملك صلاحية نشر إعلانات.</div>`;
                return;
            }

            container.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-black text-lg mb-4 text-forest flex items-center gap-2">
                        <i class="fa-solid fa-circle-plus text-gold"></i> إضافة إعلان جديد
                    </h3>
                    <div class="space-y-3">
                        <select id="list-type" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
                            <option value="job">فرصة عمل</option>
                            <option value="equipment">تأجير معدات / سقالات</option>
                        </select>
                        <input type="text" id="list-title" placeholder="عنوان الإعلان" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="list-gov" placeholder="المحافظة" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
                            <input type="text" id="list-area" placeholder="المنطقة" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
                        </div>
                        <input type="number" id="list-price" placeholder="السعر بالجنيه" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
                        <textarea id="list-desc" placeholder="التفاصيل كاملة..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-medium h-24"></textarea>
                        <button onclick="submitListing()" class="w-full bg-forest hover:bg-forestLight text-gold py-3.5 rounded-2xl font-black text-sm shadow-xl">نشر الإعلان</button>
                    </div>
                </div>
            `;
        }

        async function submitListing() {
            const type = document.getElementById('list-type').value;
            const title = document.getElementById('list-title').value.trim();
            const governorate = document.getElementById('list-gov').value.trim();
            const area = document.getElementById('list-area').value.trim();
            const price = document.getElementById('list-price').value;
            const description = document.getElementById('list-desc').value.trim();

            if (!title || !governorate || !price) {
                alert('الرجاء إكمال الحقول الأساسية');
                return;
            }

            const { error } = await supabase.from('listings').insert([
                { user_id: currentUser.id, type, title, governorate, area, price: parseFloat(price), description }
            ]);

            if (error) { alert('خطأ: ' + error.message); return; }
            alert('تم النشر بنجاح!');
            switchTab('home');
        }

        async function renderRequests(container) {
            if (!currentUser) { renderProfile(container); return; }
            container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">جاري التحميل...</div>`;

            const { data: requests, error } = await supabase.from('requests')
                .select('*, listings(title, price)')
                .or(`requester_id.eq.${currentUser.id},owner_id.eq.${currentUser.id}`)
                .order('created_at', { ascending: false });

            if (error || !requests || requests.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 text-xs">لا توجد طلبات.</div>`;
                return;
            }

            container.innerHTML = `
                <h2 class="font-black text-lg text-forest mb-4">طلباتي</h2>
                <div class="space-y-3">
                    ${requests.map(req => `
                        <div class="bg-white p-4.5 rounded-2xl shadow-sm border border-slate-200">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full font-black">${req.type === 'job' ? 'عمل' : 'تأجير'}</span>
                                <span class="text-[10px] bg-amber-100 text-amber-900 px-2.5 py-1 rounded-full font-black">${req.status}</span>
                            </div>
                            <h4 class="font-black text-slate-900 text-sm mb-3">${req.listings ? req.listings.title : 'إعلان'}</h4>
                            <button onclick="switchTab('chats')" class="w-full bg-forest text-gold text-xs py-2 rounded-xl font-black">المحادثات</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderChats(container) {
            if (!currentUser) { renderProfile(container); return; }
            container.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
                    <div class="w-14 h-14 bg-emerald-50 text-forest rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner"><i class="fa-solid fa-comments"></i></div>
                    <h3 class="font-black text-forest text-base mb-1">المحادثات المباشرة</h3>
                    <p class="text-xs text-slate-500">اختر طلباً لبدء التواصل الفوري.</p>
                </div>
            `;
        }

        function renderProfile(container) {
            if (!currentUser) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <h2 class="text-xl font-black text-forest mb-4 text-center">تسجيل الدخول / حساب جديد</h2>
                        
                        <!-- Google Auth Button -->
                        <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 py-3.5 rounded-2xl font-black flex items-center justify-center gap-2.5 shadow-sm mb-4 active:scale-95 transition">
                            <svg class="w-5 h-5" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span>تسجيل الدخول باستخدام Google</span>
                        </button>

                        <div class="relative flex py-2 items-center mb-4">
                            <div class="flex-grow border-t border-slate-200"></div>
                            <span class="flex-shrink mx-3 text-[11px] text-slate-400 font-bold">أو بالهاتف</span>
                            <div class="flex-grow border-t border-slate-200"></div>
                        </div>

                        <div class="space-y-3">
                            <input type="text" id="auth-phone" placeholder="رقم الهاتف" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
                            <input type="text" id="auth-name" placeholder="الاسم الكامل" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
                            <select id="auth-role" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-bold">
                                <option value="contractor">مقاول</option>
                                <option value="worker">عامل</option>
                                <option value="supplier">مؤجر معدات</option>
                                <option value="renter">مستأجر</option>
                            </select>
                            <button onclick="handlePhoneRegister()" class="w-full bg-forest text-gold py-3.5 rounded-2xl font-black text-sm shadow-xl">دخول</button>
                        </div>
                    </div>
                `;
                return;
            }

            let adminHTML = '';
            if (currentUser.role === 'admin') {
                adminHTML = `
                    <div class="mt-4 p-5 bg-amber-50 border border-gold/40 rounded-3xl">
                        <h3 class="font-black text-forest text-sm mb-3">لوحة تحكم المدير (حظر مستخدم)</h3>
                        <div class="space-y-2">
                            <input type="text" id="ban-id" placeholder="Short ID أو رقم الهاتف" class="w-full p-3 bg-white border border-slate-200 rounded-2xl text-xs font-bold">
                            <input type="text" id="ban-reason" placeholder="سبب الحظر" class="w-full p-3 bg-white border border-slate-200 rounded-2xl text-xs font-bold">
                            <button onclick="adminBan()" class="w-full bg-red-600 text-white py-2.5 rounded-xl text-xs font-black">حظر الحساب</button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                        <h2 class="text-lg font-black text-forest">${currentUser.full_name}</h2>
                        <span class="bg-amber-100 text-amber-900 text-xs px-3 py-1 rounded-full font-black">ID: #${currentUser.short_id || '----'}</span>
                    </div>
                    <p class="text-xs text-slate-500 mb-1">الهاتف/البريد: <span class="font-bold text-slate-800">${currentUser.phone || currentUser.email || 'غير مسجل'}</span></p>
                    <p class="text-xs text-slate-500 mb-4">نوع الحساب: <span class="font-black text-forest">${getRoleName(currentUser.role)}</span></p>
                    ${adminHTML}
                    <button onclick="logout()" class="w-full mt-5 bg-red-50 text-red-600 border border-red-200 py-3 rounded-2xl font-black text-xs">تسجيل الخروج</button>
                </div>
            `;
        }

        async function adminBan() {
            const target = document.getElementById('ban-id').value.trim();
            const reason = document.getElementById('ban-reason').value.trim() || 'مخالفة الشروط';

            if (!target) { alert('الرجاء إدخال الـ ID أو الهاتف'); return; }

            const { error } = await supabase.from('users')
                .update({ is_banned: true, ban_reason: reason })
                .or(`short_id.eq.${target},phone.eq.${target}`);

            if (error) { alert('فشل الحظر: ' + error.message); return; }
            alert('تم حظر المستخدم بنجاح!');
        }

        window.onload = initApp;
    </script>
</body>
</html>
