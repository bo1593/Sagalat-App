<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سقالات — منصة المقاولات وتأجير المعدات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#052316',
                        forestLight: '#0b3c26',
                        gold: '#D4AF37'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24 select-none">

    <!-- Supabase Client -->
    <script>
        const SUPABASE_URL = 'https://dtddkcgerdynswrbmknu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tnHt7hYa9TO4rAS-tvEkpA_sraniuzS';
        let supabase = null;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) { console.error(e); }

        let currentUser = JSON.parse(localStorage.getItem('sagalat_user')) || null;
    </script>

    <!-- Header -->
    <header class="bg-forest text-white shadow-lg sticky top-0 z-50 border-b border-gold/30">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('home')">
                <div class="w-9 h-9 rounded-xl bg-gold/15 border border-gold/40 flex items-center justify-center">
                    <i class="fa-solid fa-helmet-safety text-gold text-lg"></i>
                </div>
                <h1 class="text-xl font-black text-white tracking-wide">سـقـالات</h1>
            </div>
            <div id="header-user-area"></div>
        </div>
    </header>

    <!-- Banned Screen -->
    <div id="ban-screen" class="hidden fixed inset-0 bg-red-950/95 z-50 flex items-center justify-center p-6 text-center text-white">
        <div class="bg-white text-slate-900 p-6 rounded-3xl max-w-sm w-full shadow-2xl">
            <i class="fa-solid fa-ban text-red-600 text-5xl mb-3"></i>
            <h2 class="text-xl font-bold mb-1">تم حظر حسابك</h2>
            <p id="ban-reason-text" class="bg-red-50 text-red-700 p-3 rounded-xl text-xs mb-4 font-bold">السبب: غير محدد</p>
            <button onclick="logout()" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-bold">تسجيل الخروج</button>
        </div>
    </div>

    <!-- Main Dynamic View -->
    <main id="app-container" class="max-w-md mx-auto p-4 min-h-[75vh]">
        <!-- Screen Content -->
    </main>

    <!-- Bottom Navigation Bar (Ultra Fast Handlers) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-forest border-t border-gold/20 shadow-2xl z-50">
        <div class="max-w-md mx-auto flex justify-around py-2">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-gold text-[11px] font-bold p-1 active:scale-95 transition">
                <i class="fa-solid fa-house text-lg mb-0.5"></i>
                <span>الرئيسية</span>
            </button>
            <button onclick="switchTab('add')" id="nav-add" class="flex flex-col items-center text-slate-400 text-[11px] font-medium p-1 active:scale-95 transition">
                <i class="fa-solid fa-square-plus text-lg text-gold mb-0.5"></i>
                <span>إضافة إعلان</span>
            </button>
            <button onclick="switchTab('requests')" id="nav-requests" class="flex flex-col items-center text-slate-400 text-[11px] font-medium p-1 active:scale-95 transition">
                <i class="fa-solid fa-list-check text-lg mb-0.5"></i>
                <span>طلباتي</span>
            </button>
            <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center text-slate-400 text-[11px] font-medium p-1 active:scale-95 transition">
                <i class="fa-solid fa-comments text-lg mb-0.5"></i>
                <span>الرسائل</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-400 text-[11px] font-medium p-1 active:scale-95 transition">
                <i class="fa-solid fa-user text-lg mb-0.5"></i>
                <span>حسابي</span>
            </button>
        </div>
    </nav>

    <!-- App Logic -->
    <script>
        function renderHeader() {
            const area = document.getElementById('header-user-area');
            if (!currentUser) {
                area.innerHTML = `<button onclick="switchTab('profile')" class="bg-gold text-forest px-3 py-1.5 rounded-lg font-black text-xs">دخول</button>`;
            } else {
                area.innerHTML = `<span class="text-[11px] bg-forestLight border border-gold/40 px-2.5 py-1 rounded-full text-gold font-bold">#${currentUser.short_id || '------'}</span>`;
            }
        }

        function switchTab(tab) {
            // Instant Navigation state update without lag
            ['home', 'add', 'requests', 'chats', 'profile'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.className = (t === tab) ? 
                        "flex flex-col items-center text-gold text-[11px] font-bold p-1 active:scale-95 transition" : 
                        "flex flex-col items-center text-slate-400 text-[11px] font-medium p-1 active:scale-95 transition";
                }
            });

            const container = document.getElementById('app-container');

            if (tab === 'home') {
                container.innerHTML = `
                    <div class="mb-4">
                        <div class="bg-forest text-white p-4 rounded-2xl shadow-md border border-gold/20">
                            <div class="flex items-center justify-between mb-3">
                                <h2 class="text-lg font-black text-gold">سـقـالات</h2>
                                <span class="text-[10px] bg-forestLight px-2.5 py-1 rounded-full text-slate-300 font-bold"><i class="fa-solid fa-location-dot text-gold ml-1"></i>القاهرة</span>
                            </div>
                            <input type="text" id="search-input" onkeyup="filterFeed()" placeholder="أبحث عن فرص عمل أو معدات..." class="w-full p-2.5 bg-white text-slate-800 rounded-xl text-xs font-medium focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div onclick="filterCat('equipment')" class="bg-forest text-white p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-gold/30">
                            <i class="fa-solid fa-trowel-bricks text-gold text-2xl mb-1"></i>
                            <span class="text-xs font-black">تأجير المعدات</span>
                        </div>
                        <div onclick="filterCat('job')" class="bg-forest text-white p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer border border-gold/30">
                            <i class="fa-solid fa-helmet-safety text-gold text-2xl mb-1"></i>
                            <span class="text-xs font-black">فرص العمل</span>
                        </div>
                    </div>
                    <h3 class="font-black text-sm text-forest mb-3">أحدث الإعلانات</h3>
                    <div id="listings-feed" class="space-y-3">
                        <p class="text-center text-slate-400 py-6 text-xs">جاري جلب البيانات...</p>
                    </div>
                `;
                fetchListings();
            } else if (tab === 'add') {
                renderAddView(container);
            } else if (tab === 'requests') {
                renderRequestsView(container);
            } else if (tab === 'chats') {
                container.innerHTML = `<div class="bg-white p-6 rounded-3xl text-center text-xs text-slate-500">قسم الرسائل المباشرة</div>`;
            } else if (tab === 'profile') {
                renderProfileView(container);
            }
        }

        let feedData = [];
        async function fetchListings() {
            const feed = document.getElementById('listings-feed');
            if (!feed) return;
            try {
                const { data, error } = await supabase.from('listings').select('*').order('created_at', { ascending: false });
                if (error || !data || data.length === 0) {
                    feed.innerHTML = `<p class="text-center text-slate-400 py-6 text-xs">لا توجد إعلانات حالياً.</p>`;
                    return;
                }
                feedData = data;
                renderFeed(data);
            } catch(e) {
                feed.innerHTML = `<p class="text-center text-slate-400 py-6 text-xs">عذراً، فشل الاتصال بالسيرفر.</p>`;
            }
        }

        function renderFeed(items) {
            const feed = document.getElementById('listings-feed');
            if (!feed) return;
            feed.innerHTML = items.map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] bg-amber-50 text-amber-900 border border-amber-200 px-2 py-0.5 rounded font-bold">${item.type === 'job' ? 'فرصة عمل' : 'تأجير معدة'}</span>
                        <span class="text-[11px] text-slate-500 font-bold">${item.governorate}</span>
                    </div>
                    <h4 class="font-black text-slate-900 text-sm mb-1">${item.title}</h4>
                    <p class="text-xs text-slate-600 mb-3">${item.description || ''}</p>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                        <span class="text-forest font-black text-sm">${item.price} ج.م</span>
                        <button onclick="alert('تم تقديم طلبك بنجاح!')" class="bg-forest text-gold text-xs px-3 py-1.5 rounded-xl font-bold">تقديم طلب</button>
                    </div>
                </div>
            `).join('');
        }

        function filterFeed() {
            const q = document.getElementById('search-input').value.toLowerCase();
            renderFeed(feedData.filter(i => i.title.toLowerCase().includes(q)));
        }

        function filterCat(cat) {
            renderFeed(feedData.filter(i => i.type === cat));
        }

        function renderAddView(container) {
            if (!currentUser) { switchTab('profile'); return; }
            container.innerHTML = `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                    <h3 class="font-black text-base text-forest">إضافة إعلان جديد</h3>
                    <select id="add-type" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold">
                        <option value="job">فرصة عمل</option>
                        <option value="equipment">تأجير معدات</option>
                    </select>
                    <input type="text" id="add-title" placeholder="عنوان الإعلان" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold">
                    <input type="text" id="add-gov" placeholder="المحافظة" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold">
                    <input type="number" id="add-price" placeholder="السعر" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold">
                    <textarea id="add-desc" placeholder="التفاصيل..." class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs h-20"></textarea>
                    <button onclick="publishListing()" class="w-full bg-forest text-gold py-3 rounded-xl font-black text-xs">نشر الآن</button>
                </div>
            `;
        }

        async function publishListing() {
            const type = document.getElementById('add-type').value;
            const title = document.getElementById('add-title').value.trim();
            const governorate = document.getElementById('add-gov').value.trim();
            const price = document.getElementById('add-price').value;
            const description = document.getElementById('add-desc').value.trim();

            if (!title || !governorate || !price) { alert('اكتب البيانات الأساسية'); return; }

            const { error } = await supabase.from('listings').insert([{ user_id: currentUser.id, type, title, governorate, area: governorate, price: parseFloat(price), description }]);
            if (error) { alert('خطأ: ' + error.message); return; }
            alert('تم النشر بنجاح!');
            switchTab('home');
        }

        function renderRequestsView(container) {
            if (!currentUser) { switchTab('profile'); return; }
            container.innerHTML = `<div class="bg-white p-6 rounded-3xl text-center text-xs text-slate-500">لا توجد طلبات حية حالياً.</div>`;
        }

        function renderProfileView(container) {
            if (!currentUser) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center space-y-3">
                        <h3 class="font-black text-forest">تسجيل الدخول</h3>
                        <input type="text" id="auth-phone" placeholder="رقم الهاتف" class="w-full p-3 bg-slate-50 border rounded-xl text-xs font-bold">
                        <input type="text" id="auth-name" placeholder="الاسم الكامل" class="w-full p-3 bg-slate-50 border rounded-xl text-xs font-bold">
                        <button onclick="phoneLogin()" class="w-full bg-gold text-forest py-3 rounded-xl font-black text-xs">دخول</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                    <h3 class="font-black text-forest">${currentUser.full_name}</h3>
                    <p class="text-xs text-slate-500">Short ID: #${currentUser.short_id || '------'}</p>
                    <button onclick="logout()" class="w-full bg-red-50 text-red-600 border border-red-200 py-2.5 rounded-xl text-xs font-bold">تسجيل الخروج</button>
                </div>
            `;
        }

        async function phoneLogin() {
            const phone = document.getElementById('auth-phone').value.trim();
            const full_name = document.getElementById('auth-name').value.trim();
            if (!phone || !full_name) { alert('أدخل الهاتف والاسم'); return; }

            let { data: existing } = await supabase.from('users').select('*').eq('phone', phone).single();
            if (existing) {
                currentUser = existing;
            } else {
                const { data: newUser } = await supabase.from('users').insert([{ phone, full_name, role: 'worker' }]).select().single();
                currentUser = newUser;
            }
            localStorage.setItem('sagalat_user', JSON.stringify(currentUser));
            location.reload();
        }

        function logout() {
            localStorage.removeItem('sagalat_user');
            currentUser = null;
            location.reload();
        }

        // Start
        window.onload = () => {
            renderHeader();
            switchTab('home');
        };
    </script>
</body>
</html>
