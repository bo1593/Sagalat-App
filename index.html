<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سقالات — منصة المقاولات وتأجير المعدات في مصر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#072B1B',
                        gold: '#DAA520',
                        accentDark: '#041B11'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">

    <!-- Supabase Configuration -->
    <script>
        const SUPABASE_URL = 'https://dtddkcgerdynswrbmknu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tnHt7hYa9TO4rAS-tvEkpA_sraniuzS';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = JSON.parse(localStorage.getItem('sagalat_user')) || null;
    </script>

    <!-- Header -->
    <header class="bg-forest text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-helmet-safety text-gold text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">سـقـالات</h1>
            </div>
            <div id="header-user-area" class="text-sm"></div>
        </div>
    </header>

    <!-- Banned Notice Screen -->
    <div id="ban-screen" class="hidden fixed inset-0 bg-red-950 bg-opacity-95 z-50 flex items-center justify-center p-6 text-center text-white">
        <div class="bg-white text-slate-900 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <i class="fa-solid fa-ban text-red-600 text-5xl mb-4"></i>
            <h2 class="text-2xl font-bold mb-2">تم حظر حسابك</h2>
            <p class="text-sm text-slate-600 mb-4">عذراً، تم تعليق حسابك من قِبل إدارة منصة سقالات.</p>
            <div class="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg text-sm mb-4" id="ban-reason-text">
                السبب: غير محدد
            </div>
            <button onclick="logout()" class="w-full bg-slate-800 text-white py-2.5 rounded-xl font-semibold">تسجيل الخروج</button>
        </div>
    </div>

    <!-- Main Container -->
    <main id="app-container" class="max-w-md mx-auto p-4">
        <!-- Dynamic Content -->
    </main>

    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-40">
        <div class="max-w-md mx-auto flex justify-around py-2">
            <button onclick="switchTab('home')" class="flex flex-col items-center text-forest text-xs font-medium">
                <i class="fa-solid fa-house text-lg"></i>
                <span>الرئيسية</span>
            </button>
            <button onclick="switchTab('add')" class="flex flex-col items-center text-slate-400 hover:text-forest text-xs font-medium">
                <i class="fa-solid fa-circle-plus text-lg text-gold"></i>
                <span>إضافة إعلان</span>
            </button>
            <button onclick="switchTab('requests')" class="flex flex-col items-center text-slate-400 hover:text-forest text-xs font-medium">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span>طلباتي</span>
            </button>
            <button onclick="switchTab('chats')" class="flex flex-col items-center text-slate-400 hover:text-forest text-xs font-medium">
                <i class="fa-solid fa-comments text-lg"></i>
                <span>المحادثات</span>
            </button>
            <button onclick="switchTab('profile')" class="flex flex-col items-center text-slate-400 hover:text-forest text-xs font-medium">
                <i class="fa-solid fa-user text-lg"></i>
                <span>حسابي</span>
            </button>
        </div>
    </nav>

    <!-- Main Application Scripts -->
    <script>
        async function initApp() {
            // Check Google Auth Session
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session && session.user) {
                const authUser = session.user;
                let { data: profile } = await supabase.from('users').select('*').eq('id', authUser.id).single();

                if (!profile) {
                    const { data: newProfile } = await supabase.from('users').insert([{
                        id: authUser.id,
                        email: authUser.email,
                        full_name: authUser.user_metadata.full_name || 'مستخدم جديد',
                        phone: authUser.phone || '',
                        role: 'worker'
                    }]).select().single();
                    profile = newProfile;
                }
                currentUser = profile;
                localStorage.setItem('sagalat_user', JSON.stringify(currentUser));
            }

            if (currentUser) {
                const { data: dbUser } = await supabase.from('users').select('*').eq('id', currentUser.id).single();
                if (dbUser && dbUser.is_banned) {
                    document.getElementById('ban-reason-text').innerText = `السبب: ${dbUser.ban_reason || 'مخالفة شروط الاستخدام'}`;
                    document.getElementById('ban-screen').classList.remove('hidden');
                    return;
                }
                if (dbUser) currentUser = dbUser;
            }

            renderHeader();
            switchTab('home');
        }

        function renderHeader() {
            const area = document.getElementById('header-user-area');
            if (!currentUser) {
                area.innerHTML = `<button onclick="renderAuth()" class="bg-gold text-forest px-3 py-1.5 rounded-lg font-bold text-xs shadow">دخول / تسجيل</button>`;
            } else {
                area.innerHTML = `<span class="text-xs bg-forest border border-gold/40 px-2 py-1 rounded text-gold font-bold">#${currentUser.short_id || '------'}</span>`;
            }
        }

        function getRoleName(role) {
            const roles = { contractor: 'مقاول', worker: 'عامل', supplier: 'مؤجر', renter: 'مستأجر', admin: 'مدير النظام' };
            return roles[role] || role;
        }

        async function loginWithGoogle() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
            if (error) alert('خطأ في الاتصال بجوجل: ' + error.message);
        }

        function logout() {
            supabase.auth.signOut();
            localStorage.removeItem('sagalat_user');
            currentUser = null;
            location.reload();
        }

        function switchTab(tab) {
            const container = document.getElementById('app-container');
            if (tab === 'home') {
                container.innerHTML = `
                    <div class="mb-4">
                        <div class="bg-forest text-white p-4 rounded-2xl shadow">
                            <h2 class="text-lg font-bold mb-1">سوق المقاولات والمعدات</h2>
                            <p class="text-xs text-slate-300">خدمات السقالات وعمال البناء في جميع المحافظات</p>
                        </div>
                    </div>
                    <div id="listings-feed" class="space-y-3">
                        <p class="text-center text-slate-500 py-6">جاري تحميل الإعلانات...</p>
                    </div>
                `;
                loadListings();
            } else if (tab === 'add') {
                renderAddForm(container);
            } else if (tab === 'profile') {
                renderProfile(container);
            } else if (tab === 'requests') {
                container.innerHTML = `<div class="text-center py-10 text-slate-500">قسم الطلبات نشط عبر الخادم.</div>`;
            } else if (tab === 'chats') {
                container.innerHTML = `<div class="text-center py-10 text-slate-500">نظام المحادثات الفورية.</div>`;
            }
        }

        async function loadListings() {
            const feed = document.getElementById('listings-feed');
            const { data: listings, error } = await supabase.from('listings').select('*').order('created_at', { ascending: false });

            if (error || !listings || listings.length === 0) {
                feed.innerHTML = `<p class="text-center text-slate-500 py-6">لا توجد إعلانات حالياً.</p>`;
                return;
            }

            feed.innerHTML = listings.map(item => `
                <div class="bg-white p-4 rounded-xl shadow border border-slate-100">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold">${item.type === 'job' ? 'فرصة عمل' : 'تأجير معدة'}</span>
                        <span class="text-xs text-slate-500">${item.governorate} - ${item.area}</span>
                    </div>
                    <h3 class="font-bold text-slate-900 text-base">${item.title}</h3>
                    <p class="text-xs text-slate-600 my-1">${item.description || ''}</p>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-100 text-xs">
                        <span class="text-forest font-bold text-sm">${item.price} ج.م</span>
                        <button onclick="alert('طلب الإعلان قيد التقديم')" class="bg-forest text-gold px-3 py-1 rounded font-semibold">تفاصيل الطلب</button>
                    </div>
                </div>
            `).join('');
        }

        function renderAuth() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow border border-slate-100">
                    <h2 class="text-xl font-bold text-forest mb-4 text-center">تسجيل الدخول</h2>
                    
                    <!-- Google Button -->
                    <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-700 border border-slate-300 py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-sm mb-4 hover:bg-slate-50">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>الدخول باستخدام Google</span>
                    </button>

                    <div class="relative flex py-2 items-center mb-4">
                        <div class="flex-grow border-t border-slate-200"></div>
                        <span class="flex-shrink mx-2 text-xs text-slate-400">أو بالهاتف</span>
                        <div class="flex-grow border-t border-slate-200"></div>
                    </div>

                    <input type="text" id="auth-phone" placeholder="رقم الهاتف" class="w-full p-3 mb-3 border rounded-xl text-sm">
                    <input type="text" id="auth-name" placeholder="الاسم الكامل" class="w-full p-3 mb-3 border rounded-xl text-sm">
                    <select id="auth-role" class="w-full p-3 mb-3 border rounded-xl text-sm bg-white">
                        <option value="contractor">مقاول</option>
                        <option value="worker">عامل</option>
                        <option value="supplier">مؤجر معدات</option>
                        <option value="renter">مستأجر</option>
                    </select>

                    <button onclick="handlePhoneRegister()" class="w-full bg-forest text-gold py-3 rounded-xl font-bold shadow">دخول بالهاتف</button>
                </div>
            `;
        }

        async function handlePhoneRegister() {
            const phone = document.getElementById('auth-phone').value.trim();
            const full_name = document.getElementById('auth-name').value.trim();
            const role = document.getElementById('auth-role').value;

            if (!phone || !full_name) {
                alert('الرجاء تعبئة اسم المستخدم ورقم الهاتف');
                return;
            }

            let { data: existing } = await supabase.from('users').select('*').eq('phone', phone).single();

            if (existing) {
                if (existing.is_banned) {
                    alert('هذا الحساب محظور من المنصة!');
                    return;
                }
                currentUser = existing;
            } else {
                const { data: newUser, error } = await supabase.from('users').insert([
                    { phone, full_name, role }
                ]).select().single();

                if (error) {
                    alert('خطأ أثناء إنشاء الحساب: ' + error.message);
                    return;
                }
                currentUser = newUser;
            }

            localStorage.setItem('sagalat_user', JSON.stringify(currentUser));
            alert('تم تسجيل الدخول بنجاح!');
            location.reload();
        }

        function renderAddForm(container) {
            if (!currentUser) {
                renderAuth();
                return;
            }

            if (currentUser.role === 'worker' || currentUser.role === 'renter') {
                container.innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-xl text-center font-semibold">حسابك (${getRoleName(currentUser.role)}) لا يملك صلاحية نشر إعلانات.</div>`;
                return;
            }

            container.innerHTML = `
                <div class="bg-white p-4 rounded-2xl shadow">
                    <h3 class="font-bold mb-3 text-forest">إضافة إعلان جديد</h3>
                    <select id="list-type" class="w-full p-2.5 border rounded-xl text-sm mb-3 bg-white">
                        <option value="job">فرصة عمل</option>
                        <option value="equipment">تأجير معدات / سقالات</option>
                    </select>
                    <input type="text" id="list-title" placeholder="عنوان الإعلان" class="w-full p-2.5 border rounded-xl text-sm mb-3">
                    <input type="text" id="list-gov" placeholder="المحافظة" class="w-full p-2.5 border rounded-xl text-sm mb-3">
                    <input type="text" id="list-area" placeholder="المنطقة" class="w-full p-2.5 border rounded-xl text-sm mb-3">
                    <input type="number" id="list-price" placeholder="السعر بالجنيه" class="w-full p-2.5 border rounded-xl text-sm mb-3">
                    <textarea id="list-desc" placeholder="التفاصيل الشاملة" class="w-full p-2.5 border rounded-xl text-sm mb-3"></textarea>
                    <button onclick="submitListing()" class="w-full bg-forest text-gold py-2.5 rounded-xl font-bold">نشر الإعلان</button>
                </div>
            `;
        }

        async function submitListing() {
            const type = document.getElementById('list-type').value;
            const title = document.getElementById('list-title').value;
            const governorate = document.getElementById('list-gov').value;
            const area = document.getElementById('list-area').value;
            const price = document.getElementById('list-price').value;
            const description = document.getElementById('list-desc').value;

            if (!title || !governorate || !price) {
                alert('الرجاء إكمال البيانات المطلوب نشرها');
                return;
            }

            const { error } = await supabase.from('listings').insert([
                { user_id: currentUser.id, type, title, governorate, area, price: parseFloat(price), description }
            ]);

            if (error) {
                alert('فشل النشر: ' + error.message);
                return;
            }

            alert('تم نشر الإعلان بنجاح!');
            switchTab('home');
        }

        function renderProfile(container) {
            if (!currentUser) {
                renderAuth();
                return;
            }

            let adminHTML = '';
            if (currentUser.role === 'admin') {
                adminHTML = `
                    <div class="mt-4 p-4 bg-amber-50 border border-gold/30 rounded-xl">
                        <h3 class="font-bold text-forest mb-2">لوحة إشراف المدير</h3>
                        <input type="text" id="ban-id" placeholder="الـ Short ID أو رقم هاتف المستهدف" class="w-full p-2 border rounded text-xs mb-2 bg-white">
                        <input type="text" id="ban-reason" placeholder="سبب التبنيد" class="w-full p-2 border rounded text-xs mb-2 bg-white">
                        <button onclick="adminBan()" class="w-full bg-red-600 text-white py-2 rounded text-xs font-bold">تبنيد الحساب فوراً</button>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-lg font-bold text-forest">${currentUser.full_name}</h2>
                        <span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold">Short ID: #${currentUser.short_id || '----'}</span>
                    </div>
                    <p class="text-xs text-slate-500 mb-1">بيانات الاتصال: ${currentUser.phone || currentUser.email || 'غير مسجلة'}</p>
                    <p class="text-xs text-slate-500 mb-4">نوع الحساب: <span class="font-bold text-forest">${getRoleName(currentUser.role)}</span></p>
                    ${adminHTML}
                    <button onclick="logout()" class="w-full mt-4 bg-red-50 text-red-600 border border-red-200 py-2.5 rounded-xl font-bold text-sm">تسجيل الخروج</button>
                </div>
            `;
        }

        async function adminBan() {
            const target = document.getElementById('ban-id').value.trim();
            const reason = document.getElementById('ban-reason').value.trim() || 'مخالفة الشروط';

            if (!target) {
                alert('الرجاء كتابة رقم الهاتف أو Short ID');
                return;
            }

            const { error } = await supabase.from('users')
                .update({ is_banned: true, ban_reason: reason })
                .or(`short_id.eq.${target},phone.eq.${target}`);

            if (error) {
                alert('فشل الحظر: ' + error.message);
                return;
            }
            alert('تم حظر المستخدم وتسجيل السبب في قاعدة البيانات بنجاح!');
        }

        window.onload = initApp;
    </script>
</body>
</html>
